# ASHP heat output corrected for the return-water sensor offset.
#
# The return thermistor R4T reads ~0.61 K above both leaving-side sensors (R1T and R10T agree within
# 0.01 K). Found 13 Nov 2026 from 2,988 steady idle minutes (pump on, compressor off > 20 min, no DHW):
# R1T - R4T = -0.61 K on average, independent of the water-to-outside difference, i.e. an offset, not a
# heat loss. Daikin's own heat counter (meters_energy_produced_compressor_heating) is not affected: it
# matches flow x (R1T - R4T + 0.61 K) within its 1 kWh resolution on 6-9 Nov, and the uncorrected value is
# about a third low. sensor.bridge0_power_production_heatpump (flow x (R1T - R4T)) therefore reads
# ~500 W low at 12 L/min, negative whenever the pump runs with the compressor off.
#
# If the offset is re-measured, change it here and in packages/ashp_defrost.yaml.
template:
  - sensor:
      - name: "ASHP heat output"
        unique_id: ashp_heat_output_corrected
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:heat-wave
        availability: >
          {{ has_value('sensor.bridge0_sensors_flow')
             and has_value('sensor.bridge0_sensors_temperature_r1t_hp2gas_water')
             and has_value('sensor.bridge0_sensors_temperature_r4t_return_water') }}
        state: >
          {% set offset_k = 0.61 %}
          {% set flow = states('sensor.bridge0_sensors_flow') | float(0) %}
          {% set lwt = states('sensor.bridge0_sensors_temperature_r1t_hp2gas_water') | float(0) %}
          {% set rwt = states('sensor.bridge0_sensors_temperature_r4t_return_water') | float(0) %}
          {{ (flow * (lwt - rwt + offset_k) * 4186 / 60) | round(0) if flow > 0 else 0 }}
        attributes:
          return_offset_k: 0.61
          note: "flow x (R1T - R4T + 0.61 K); R4T reads ~0.61 K high"

      # Corrected heat output split by the DHW 3-way valve, for the measured-heat integrals (UI helpers
      # "ASHP heating heat measured" / "ASHP DHW heat measured" and their daily..yearly utility meters).
      # Net values: idle pump residual (~ -10 W) and heat drawn back during a defrost count negative.
      # Checked 20 Oct - 10 Nov: heating 235.0 vs Daikin counter 237 kWh, DHW 44.9 vs 47 kWh.
      - name: "ASHP heating heat output"
        unique_id: ashp_heating_heat_output
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:radiator
        availability: "{{ has_value('sensor.ashp_heat_output') }}"
        state: >
          {{ 0 if is_state('binary_sensor.bridge0_dhw_valve_dhw_tank', 'on')
             else states('sensor.ashp_heat_output') | float(0) }}

      - name: "ASHP DHW heat output"
        unique_id: ashp_dhw_heat_output
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:water-boiler
        availability: "{{ has_value('sensor.ashp_heat_output') }}"
        state: >
          {{ states('sensor.ashp_heat_output') | float(0)
             if is_state('binary_sensor.bridge0_dhw_valve_dhw_tank', 'on') else 0 }}

      # Heat made today (heating + DHW, measured), for the "Today" displays (HA ASHP page, tablet COP today).
      # 13 Nov 2026 only: + 11 kWh, the Daikin-counter heat before the measured meters started at 13:42 GMT.
      - name: "ASHP total heat measured daily"
        unique_id: ashp_total_heat_measured_daily
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:heat-wave
        availability: >
          {{ has_value('sensor.ashp_heating_heat_measured_daily') and has_value('sensor.ashp_dhw_heat_measured_daily') }}
        state: >
          {% set carry = 11 if now() < as_datetime('2026-11-14T00:00:00+00:00') else 0 %}
          {{ (states('sensor.ashp_heating_heat_measured_daily') | float(0)
              + states('sensor.ashp_dhw_heat_measured_daily') | float(0) + carry) | round(2) }}

      # Live COP for the ASHP page gauge: 5-min time-weighted means (UI "statistics" helpers, average_step,
      # max_age 5 min) of the corrected heat and the HomeWizard meter. Replaces bridge0_cop_cop_realtime, which
      # divides the uncorrected heat by Daikin's own power estimate. Only while the compressor runs.
      - name: "ASHP COP now"
        unique_id: ashp_cop_now
        state_class: measurement
        icon: mdi:gauge
        availability: >
          {{ has_value('sensor.ashp_heat_output_5_min') and has_value('sensor.ashp_electrical_power_5_min') }}
        state: >
          {% set heat = states('sensor.ashp_heat_output_5_min') | float(0) %}
          {% set elec = states('sensor.ashp_electrical_power_5_min') | float(0) %}
          {{ (heat / elec) | round(2) if is_state('binary_sensor.bridge0_mode_compressor', 'on') and elec > 300 else none }}

      - name: "ASHP return temperature"
        unique_id: ashp_return_temperature_corrected
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-water
        availability: "{{ has_value('sensor.bridge0_sensors_temperature_r4t_return_water') }}"
        state: >
          {{ (states('sensor.bridge0_sensors_temperature_r4t_return_water') | float(0) - 0.61) | round(2) }}
        attributes:
          return_offset_k: 0.61
          note: "R4T - 0.61 K (R4T reads ~0.61 K above R1T/R10T)"
