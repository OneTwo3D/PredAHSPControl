# ASHP COP sensors.
# Heat (since 13 Nov 2026 13:42 GMT): measured heat = integral of the offset-corrected flow x dT, split by the
# DHW valve (packages/ashp_heat_output.yaml + UI helpers "ASHP {heating,DHW} heat measured {daily..yearly}"),
# instead of Daikin's whole-kWh compressor counters. 20 Oct-10 Nov the two agreed within 1-5 %.
# Until each period rolls over, the Daikin-counter value of that period at the switch is carried over
# (the measured meters only started at the switch); the carry drops out by itself at the date given.
# Total COP = all heat (heating + DHW) / the whole heat-pump meter, standby included.
# 'unknown' instead of a value when the period has no meaningful use (< 0.1 kWh) or no heat yet.
template:

  - trigger:
      - platform: state
        entity_id: [sensor.ashp_heating_heat_measured_daily, sensor.ashp_heating_power_consumption_daily]
    sensor:
      - name: "ASHP Heating COP (daily)"
        unique_id: ashp_heating_cop_daily
        state_class: measurement
        state: >
          {% set carry = 11 if now() < as_datetime('2026-11-14T00:00:00+00:00') else 0 %}
          {% set heat = states('sensor.ashp_heating_heat_measured_daily') | float(0) + carry %}
          {% set elec = states('sensor.ashp_heating_power_consumption_daily') | float(0) %}
          {{ (heat / elec) | round(2) if elec > 0.1 and heat > 0 else none }}

  - trigger:
