# ASHP COP sensors (replaces the 12 trigger templates in your own template file - delete those in the
# same restart; the unique_ids are the same, so entity IDs and history are kept).
# Changes against the old version:
#  - recalculated when either the heat produced or the electricity changes (the old ones only on a whole
#    kWh of heat, so they could stay hours or days out of date);
#  - 'unknown' instead of the last old value when the period has no meaningful use (< 0.1 kWh) or no
#    heat yet (the Daikin heat counters step in whole kWh, so a daily COP is coarse early in the day).
# Total COP = all heat produced / the whole heat-pump meter, standby included.
template:
  - trigger:
      - platform: state
        entity_id: [sensor.ashp_heating_energy_produced_daily, sensor.ashp_heating_power_consumption_daily]
    sensor:
      - name: "ASHP Heating COP (daily)"
        unique_id: ashp_heating_cop_daily
        state_class: measurement
        state: >
          {% set heat = states('sensor.ashp_heating_energy_produced_daily') | float(0) %}
          {% set elec = states('sensor.ashp_heating_power_consumption_daily') | float(0) %}
          {{ (heat / elec) | round(2) if elec > 0.1 and heat > 0 else none }}

  - trigger:
