name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component numpy
      - run: pytest -q tests_ha -o asyncio_mode=auto -p no:cacheprovider

  release:
    # Creates a tag + GitHub release for the manifest version if it has no tag yet, after tests pass.
    needs: [core, home-assistant]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release the current manifest version if it has no tag yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v=$(python3 -c "import json;print(json.load(open('custom_components/daikin_mpc/manifest.json'))['version'])")
          tag="v$v"
          python3 .github/scripts/changelog.py versions | grep -qx "$v" \
            || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "$tag already released"; exit 0; fi
          # The release is always cut at the commit that triggered this run: GITHUB_TOKEN may not create
          # tags on older commits whose workflow files differ from the current ones.
          python3 .github/scripts/changelog.py notes "$v" > notes.md
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md
          echo "released $tag at $GITHUB_SHA"
