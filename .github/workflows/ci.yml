name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component numpy
      - run: pytest -q tests_ha -o asyncio_mode=auto -p no:cacheprovider

  release:
    # Creates a tag + GitHub release for every manifest version that has no tag yet, after tests pass.
    needs: [core, home-assistant]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(python3 -c "import json;print(json.load(open('custom_components/daikin_mpc/manifest.json'))['version'])")
          python3 .github/scripts/changelog.py versions > versions.txt
          grep -qx "$current" versions.txt || { echo "::error::CHANGELOG.md has no section for $current"; exit 1; }
          while read -r v; do
            tag="v$v"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "$tag exists"; continue; fi
            ref=$(python3 .github/scripts/changelog.py ref "$v")
            if [ -z "$ref" ]; then
              [ "$v" = "$current" ] || { echo "skip $tag: not current and no ref"; continue; }
              ref=$GITHUB_SHA
            fi
            python3 .github/scripts/changelog.py notes "$v" > notes.md
            flags=""
            [ "$v" = "$current" ] || flags="--latest=false"
            gh release create "$tag" --target "$ref" --title "$tag" --notes-file notes.md $flags
            echo "created $tag at $ref"
          done < versions.txt
