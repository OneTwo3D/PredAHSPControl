[project]
name = "daikin-mpc"
version = "0.1.0"
description = "Self-learning supervisory controller for Daikin Altherma via P1P2MQTT (Home Assistant)"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
tools = ["pandas>=2.2", "websockets>=13"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas>=2.2", "websockets>=13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Units and maths in docstrings intentionally use −, –, ·, ².
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["custom_components/daikin_mpc/core"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402", "E501"]
"tests/*" = ["E402"]

# The HA layer is type-checked only where Home Assistant is installed; core checks run everywhere.
[[tool.mypy.overrides]]
module = ["custom_components.daikin_mpc", "custom_components.daikin_mpc.coordinator", "custom_components.daikin_mpc.sensor", "custom_components.daikin_mpc.config_flow", "custom_components.daikin_mpc.diagnostics", "custom_components.daikin_mpc.const", "daikin_mpc", "daikin_mpc.coordinator", "daikin_mpc.sensor", "daikin_mpc.config_flow", "daikin_mpc.diagnostics", "daikin_mpc.const"]
follow_imports = "skip"
ignore_errors = true

[tool.setuptools.packages.find]
include = ["custom_components*"]
namespaces = true
