[project]
name = "daikin-mpc"
version = "0.1.0"
description = "Self-learning supervisory controller for Daikin Altherma via P1P2MQTT (Home Assistant)"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
tools = ["pandas>=2.2", "websockets>=13"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas>=2.2", "websockets>=13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Units and maths in docstrings intentionally use −, –, ·, ².
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["custom_components/daikin_mpc/core"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402", "E501"]
"tests/*" = ["E402"]
